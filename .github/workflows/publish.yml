name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The daily refresh commits fresh data as github-actions[bot]. A push made with the
  # built-in token does not trigger the push event above, so without this the site would
  # keep serving the last human-pushed capture while data/ moved on. workflow_run fires on
  # the refresh completing regardless of which token pushed, so the live pages track the feed.
  workflow_run:
    workflows: [refresh]
    types: [completed]

# The site is generated from the committed snapshot, so publishing never reads the live
# service. A deploy cannot be blocked by a busy origin, and the pages always match the
# snapshot in the repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # On a refresh completion, only deploy if it succeeded; a failed refresh leaves data/
    # unchanged, so re-rendering would just republish the same pages.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # --system alone hits Ubuntu's externally-managed marker on the runner's
      # interpreter. uv's own Python is the one this project pins anyway.
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - run: uv run python -m technocore_census.cli render --report data/report.json --out site
      - name: keep the skill beside the site so an agent can install it from one URL
        run: cp SKILL.md site/skill.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
