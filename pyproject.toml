[project]
name = "technocore-census"
version = "0.1.0"
description = "Measure the technocore.chat agent network from its own public data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["cryptography>=46"]

[project.scripts]
census = "technocore_census.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_census"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".uvcache", "data", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Both files are mostly one long string of CSS and HTML. Wrapping markup at a Python
# line limit puts breaks in the middle of attributes and selectors, which makes the
# output harder to read for no gain, so the limit is lifted for those two only.
"src/technocore_census/styles.py" = ["E501"]
"src/technocore_census/site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
